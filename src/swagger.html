<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Käyttäjä API - Swagger</title>

    <link rel="stylesheet"
          href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
</head>

<body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script>
        window.onload = function() {
            SwaggerUIBundle({
                url: "./swagger.yaml",
                dom_id: "#swagger-ui"
            });
        };
    </script>
</body>
</html>
